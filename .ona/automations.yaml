tasks:
  installDeps:
    name: Install dependencies
    description: Create a virtual environment and install the project in editable mode.
    command: |
      python3 -m venv .venv
      .venv/bin/python -m pip install -e .
    triggeredBy:
      - postDevcontainerStart

  migrate:
    name: Apply migrations
    description: Apply Django database migrations.
    command: |
      .venv/bin/python manage.py migrate
    triggeredBy:
      - postDevcontainerStart
    dependsOn:
      - installDeps

services:
  devServer:
    name: Django Dev Server
    description: Run the Django development server.
    commands:
      start: |
        .venv/bin/python manage.py runserver 0.0.0.0:8000
      ready: |
        curl -sf http://localhost:8000 > /dev/null
