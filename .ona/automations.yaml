tasks:
  installDeps:
    name: Install dependencies
    description: Create a virtualenv and install the project in editable mode.
    command: |
      python -m venv .venv
      .venv/bin/python -m pip install -e .
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  check:
    name: Run checks
    description: Run Django system checks.
    command: |
      .venv/bin/python manage.py check
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  devServer:
    name: Django Dev Server
    description: Run the Django development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 8000 --dont-wait --admission creator_only --name "Django Dev Server"
        # The project's ALLOWED_HOSTS is empty, so Django would reject requests
        # arriving through Ona's exposed-port domain. Generate a throwaway dev-only
        # settings module that reuses config.settings and relaxes the host allowlist,
        # then point Django at it. Kept out of the repo so application settings stay
        # untouched; autoreload keeps working because manage.py runs normally.
        printf 'from config.settings import *\nALLOWED_HOSTS = ["*"]\n' > /tmp/ona_dev_settings.py
        PYTHONPATH=/tmp DJANGO_SETTINGS_MODULE=ona_dev_settings .venv/bin/python manage.py runserver 0.0.0.0:8000
      ready: |
        curl -sf http://localhost:8000/admin/
