tasks:
  installDeps:
    name: Install dependencies
    description: Create a virtual environment and install the project in editable mode.
    command: |
      python3 -m venv .venv
      .venv/bin/python -m pip install -e .
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

services:
  dev-server:
    name: Django dev server
    description: Run the Django development server.
    commands:
      start: |
        ona environment port open 8000 --admission creator_only --name dev-server
        .venv/bin/python manage.py runserver 0.0.0.0:8000
      ready: |
        curl -sf http://localhost:8000 > /dev/null
